name: Build and Test in Debug and Release Workflow

on: [pull_request]

jobs:
  build:
  runs-on: ubuntu-latest
  strategy:
    matrix:
    configuration: [Debug, Release]
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        name: build-files
        path: dist/
        retention-days: 7
    - name: Build project
      run: dotnet build Fingerprint.Unifications/Fingerprint.Unifications.csproj --configuration ${{ matrix.configuration }}
test:
  needs: build
  runs-on: ubuntu-latest
  strategy:
    matrix:
    configuration: [Debug, Release]
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run tests
      run: dotnet test Fingerprint.UnificationsTests/Fingerprint.UnificationsTests.csproj --configuration ${{matrix.configuration }}
deploy:
  needs: build
  runs-on: ubuntu-latest
  steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-files
        path: dist/
    - name: Deploy
      run: ./deploy.sh